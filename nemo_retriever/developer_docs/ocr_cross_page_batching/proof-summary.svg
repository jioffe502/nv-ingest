<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1100" viewBox="0 0 1000 1100" role="img" aria-labelledby="title desc">
  <title id="title">Issue 2323 local OCR batching evidence on NVIDIA H100 GPUs</title>
  <desc id="desc">The patch batches crops across page rows and improves local OCR model and actor throughput on one H100. BO767 whole-ingest throughput improves by 8.41 percent, while full ViDoRe v3 one-H100 throughput is unchanged. Self-hosted NIM and four-H100 service results are deployment context only.</desc>
  <rect width="1000" height="1100" fill="#ffffff"/>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2937; }
    .title { font-size: 22px; font-weight: 650; }
    .panel { font-size: 16px; font-weight: 600; }
    .label { font-size: 13px; }
    .value { font-size: 15px; font-weight: 650; }
    .note { font-size: 13px; fill: #4b5563; }
    .small { font-size: 12px; fill: #4b5563; }
    .grid { stroke: #d1d5db; stroke-width: 1; }
    .axis { stroke: #6b7280; stroke-width: 1.2; }
    .upstream { fill: #6b7280; }
    .patch { fill: #76b900; }
    .nim { fill: #2563eb; }
    .serviceMain { fill: #ffffff; stroke: #7c3aed; stroke-width: 2; }
    .service { fill: #7c3aed; }
  </style>

  <text x="40" y="34" class="title">Issue #2323 · bounded cross-page local OCR batching</text>
  <text x="40" y="59" class="note">All GPU measurements use NVIDIA H100 80GB HBM3 · ingest timers exclude query evaluation</text>
  <line x1="40" y1="78" x2="960" y2="78" class="grid"/>

  <text x="40" y="112" class="title">What changed · local Hugging Face path · 1× H100</text>
  <text x="40" y="137" class="note">128 fixed real crops · persistent Nemotron OCR v2 wrapper · outer lists bounded at 8</text>

  <text x="40" y="170" class="panel">Model invocations per 128 crops</text>
  <line x1="70" y1="340" x2="445" y2="340" class="axis"/>
  <line x1="70" y1="180" x2="445" y2="180" class="grid"/>
  <line x1="70" y1="260" x2="445" y2="260" class="grid"/>
  <text x="48" y="345" class="label">0</text>
  <text x="40" y="265" class="label">64</text>
  <text x="32" y="185" class="label">128</text>
  <rect x="135" y="180" width="90" height="160" rx="3" class="upstream"/>
  <rect x="290" y="320" width="90" height="20" rx="3" class="patch"/>
  <text x="180" y="170" text-anchor="middle" class="value">128</text>
  <text x="335" y="310" text-anchor="middle" class="value">16</text>
  <text x="180" y="362" text-anchor="middle" class="label">Upstream · scalar</text>
  <text x="335" y="362" text-anchor="middle" class="label">Patch · lists of 8</text>

  <text x="525" y="170" class="panel">Median throughput (crops/s)</text>
  <line x1="555" y1="340" x2="955" y2="340" class="axis"/>
  <line x1="555" y1="260" x2="955" y2="260" class="grid"/>
  <line x1="555" y1="180" x2="955" y2="180" class="grid"/>
  <text x="535" y="345" class="label">0</text>
  <text x="525" y="265" class="label">40</text>
  <text x="525" y="185" class="label">80</text>
  <rect x="595" y="271.2" width="58" height="68.8" rx="3" class="upstream"/>
  <rect x="659" y="228.4" width="58" height="111.6" rx="3" class="patch"/>
  <rect x="785" y="258.7" width="58" height="81.3" rx="3" class="upstream"/>
  <rect x="849" y="193.2" width="58" height="146.8" rx="3" class="patch"/>
  <text x="624" y="263" text-anchor="middle" class="value">34.4</text>
  <text x="688" y="220" text-anchor="middle" class="value">55.8</text>
  <text x="814" y="250" text-anchor="middle" class="value">40.7</text>
  <text x="878" y="185" text-anchor="middle" class="value">73.4</text>
  <text x="656" y="362" text-anchor="middle" class="label">OCR actor · 1.62×</text>
  <text x="846" y="362" text-anchor="middle" class="label">Local model · 1.81×</text>

  <line x1="40" y1="390" x2="960" y2="390" class="grid"/>
  <text x="40" y="425" class="title">Whole-ingest impact · local Hugging Face path · 1× H100</text>
  <text x="40" y="450" class="note">Extraction, OCR, embedding, and LanceDB indexing are all included</text>

  <text x="40" y="482" class="panel">BO767 throughput (pages/s)</text>
  <line x1="70" y1="640" x2="445" y2="640" class="axis"/>
  <line x1="70" y1="490" x2="445" y2="490" class="grid"/>
  <text x="48" y="645" class="label">0</text>
  <text x="40" y="495" class="label">40</text>
  <rect x="135" y="512.4" width="90" height="127.6" rx="3" class="upstream"/>
  <rect x="290" y="501.6" width="90" height="138.4" rx="3" class="patch"/>
  <text x="180" y="504" text-anchor="middle" class="value">34.04</text>
  <text x="335" y="493" text-anchor="middle" class="value">36.90</text>
  <text x="180" y="662" text-anchor="middle" class="label">Upstream</text>
  <text x="335" y="662" text-anchor="middle" class="label">Patch · +8.41%</text>
  <text x="257" y="684" text-anchor="middle" class="small">54,730 pages · counterbalanced A/B</text>

  <text x="525" y="482" class="panel">Full ViDoRe v3 throughput (pages/s)</text>
  <line x1="555" y1="640" x2="955" y2="640" class="axis"/>
  <line x1="555" y1="490" x2="955" y2="490" class="grid"/>
  <text x="535" y="645" class="label">0</text>
  <text x="525" y="495" class="label">10</text>
  <rect x="650" y="500.8" width="90" height="139.2" rx="3" class="upstream"/>
  <rect x="805" y="501.0" width="90" height="139.0" rx="3" class="patch"/>
  <text x="695" y="492" text-anchor="middle" class="value">9.280</text>
  <text x="850" y="492" text-anchor="middle" class="value">9.268</text>
  <text x="695" y="662" text-anchor="middle" class="label">Upstream</text>
  <text x="850" y="662" text-anchor="middle" class="label">Patch · −0.12%</text>
  <text x="775" y="684" text-anchor="middle" class="small">19,252 pages · 8/8 passed · effectively flat</text>

  <line x1="40" y1="710" x2="960" y2="710" class="grid"/>
  <text x="40" y="745" class="title">Full ViDoRe v3 deployment context · H100 80GB</text>
  <text x="40" y="770" class="note">Only the two local-HF bars are the patch A/B · remote NIM and service paths are unchanged</text>
  <text x="40" y="802" class="panel">Aggregate throughput (pages/s · higher is better)</text>
  <line x1="60" y1="995" x2="960" y2="995" class="axis"/>
  <line x1="60" y1="805" x2="960" y2="805" class="grid"/>
  <text x="40" y="1000" class="label">0</text>
  <text x="32" y="810" class="label">20</text>

  <rect x="80" y="906.8" width="110" height="88.2" rx="3" class="upstream"/>
  <rect x="250" y="907.0" width="110" height="88.0" rx="3" class="patch"/>
  <rect x="420" y="903.3" width="110" height="91.7" rx="3" class="nim"/>
  <rect x="600" y="852.6" width="110" height="142.4" rx="3" class="serviceMain"/>
  <rect x="780" y="835.2" width="110" height="159.8" rx="3" class="service"/>
  <text x="135" y="898" text-anchor="middle" class="value">9.280</text>
  <text x="305" y="898" text-anchor="middle" class="value">9.268</text>
  <text x="475" y="895" text-anchor="middle" class="value">9.652</text>
  <text x="655" y="844" text-anchor="middle" class="value">≈14.994</text>
  <text x="835" y="827" text-anchor="middle" class="value">16.820</text>

  <text x="135" y="1018" text-anchor="middle" class="label">Local HF upstream</text>
  <text x="135" y="1037" text-anchor="middle" class="small">1× H100</text>
  <text x="305" y="1018" text-anchor="middle" class="label">Local HF patch</text>
  <text x="305" y="1037" text-anchor="middle" class="small">1× H100</text>
  <text x="475" y="1018" text-anchor="middle" class="label">Self-hosted NIMs</text>
  <text x="475" y="1037" text-anchor="middle" class="small">1× H100 · context</text>
  <text x="655" y="1018" text-anchor="middle" class="label">Service · current main</text>
  <text x="655" y="1037" text-anchor="middle" class="small">4× H100 · nightly</text>
  <text x="835" y="1018" text-anchor="middle" class="label">Service compatibility</text>
  <text x="835" y="1037" text-anchor="middle" class="small">4× H100 · PR branch</text>

  <text x="500" y="1070" text-anchor="middle" class="small">Nightly service value is calculated from supplied rounded per-dataset timers (19,252 pages / 1,284.02 s)</text>
  <text x="500" y="1090" text-anchor="middle" class="small">NIM/service values compare deployment modes; they do not measure this local-only code change</text>
</svg>
